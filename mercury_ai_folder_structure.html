    {t:'d',n:'rca/',c:'root-cause analysis engine',p:'W2',bg:'var(--bg-warning)',cl:'var(--text-warning)',ch:[
      {t:'f',n:'__init__.py',c:''},
      {t:'f',n:'diagnosis_schema.py',c:'RCADiagnosis pydantic output model'},
      {t:'f',n:'agent.py',c:'tool-use LLM with get_span / get_stats tools'},

    ]},
  ]},
  {t:'d',n:'stats/',c:'full statistics layer',p:'W3',bg:'var(--bg-success)',cl:'var(--text-success)',ch:[

    {t:'f',n:'significance.py',c:'paired Wilcoxon + bootstrap CI + BH correction'},

  {t:'d',n:'api/',c:'platform API + SDK',p:'W5',bg:'var(--border-strong)',cl:'var(--text-secondary)',ch:[

    {t:'f',n:'main.py',c:'FastAPI app — mounts all routers'},

    {t:'d',n:'routes/',c:'',ch:[
      {t:'f',n:'__init__.py',c:''},
      {t:'f',n:'ingest.py',c:'POST /ingest/run'},
      {t:'f',n:'rca.py',c:'POST /rca/diagnose  POST /rca/diagnose-cluster'},

  {t:'d',n:'benchmark/',c:'public reproducible benchmark',p:'W5',bg:'var(--border-strong)',cl:'var(--text-secondary)',ch:[
    {t:'f',n:'run_benchmark.py',c:'self-contained — runs on SQLite, no setup'},

    {t:'f',n:'leaderboard.csv',c:'model · date · top1 · false-alarm-rate'},
    {t:'f',n:'README.md',c:'3-command quickstart + submit instructions'},
  ]},
  {t:'d',n:'tests/',c:'all pytest tests',ch:[
    {t:'f',n:'test_connection_tester.py',c:'respx mocks for all 4 platforms'},
    {t:'f',n:'test_pii_redactor.py',c:'recall ≥ 0.95 on seeded PII'},

    {t:'f',n:'inject_faults.py',c:'run all 6 fault classes + label DB'},

    {t:'f',n:'rca_accuracy_report.md',c:'scorecard template filled by run_eval.py'},
    {t:'f',n:'CONTRIBUTING.md',c:'how to add adapter · run tests · submit PR'},
  ]},
  {t:'f',n:'mercury_cli.py',c:'entry point — mercury setup / status / ingest'},
  {t:'f',n:'mercury_config.json',c:'generated on setup — gitignored'},
  {t:'f',n:'alembic.ini',c:'points to DATABASE_URL env var'},
  {t:'f',n:'pyproject.toml',c:'all deps + mercury-ai-sdk package config'},
  {t:'f',n:'.env.example',c:'all required env vars with placeholder values'},

  {t:'f',n:'README.md',c:'pip install + quickstart + benchmark link'},
];

const wrap = document.getElementById('tree');

const rh = document.createElement('div');
rh.style='display:flex;align-items:center;gap:7px;padding:2px 6px 8px;';
rh.innerHTML='<i class="ti ti-folder-open" aria-hidden="true" style="font-size:16px;color:var(--text-accent)"></i><span style="font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text-primary)">mercury-ai/</span>';
wrap.appendChild(rh);

function build(items, container, pfx, depth) {
  items.forEach((item, i) => {
    const last = i === items.length - 1;
    const conn = last ? '└── ' : '├── ';
    const cPfx = last ? '    ' : '│   ';

    const row = document.createElement('div');
    row.style='display:flex;align-items:center;padding:2px 4px;border-radius:3px;min-height:22px;gap:0;';

    const pre = document.createElement('span');
    pre.style='font-family:var(--font-mono);font-size:11px;color:var(--border-stronger);white-space:pre;flex-shrink:0;';
    pre.textContent = pfx + conn;
    row.appendChild(pre);

    const ic = document.createElement('i');
    ic.setAttribute('aria-hidden','true');
    ic.className = item.t === 'd' ? 'ti ti-folder' : 'ti ti-file-text';
    ic.style = 'font-size:13px;flex-shrink:0;margin-right:5px;color:' + (item.t==='d' ? 'var(--text-accent)' : 'var(--text-muted)');
    row.appendChild(ic);

    const nm = document.createElement('span');
    nm.style = 'font-family:var(--font-mono);font-size:12px;color:var(--text-primary);flex-shrink:0;' + (item.t==='d' ? 'font-weight:500;' : '');
    nm.textContent = item.n;
    row.appendChild(nm);

    if (item.p) {
      const bg = item.bg || 'var(--bg-accent)';
      const cl = item.cl || 'var(--text-accent)';
      const badge = document.createElement('span');
      badge.style='font-family:var(--font-sans);font-size:10px;padding:1px 6px;border-radius:8px;margin-left:7px;flex-shrink:0;background:'+bg+';color:'+cl+';';
      badge.textContent = item.p;
      row.appendChild(badge);
    }

    if (item.c) {
      const cmt = document.createElement('span');
      cmt.style='font-family:var(--font-sans);font-size:11px;color:var(--text-muted);margin-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;';
      cmt.textContent = '# ' + item.c;
      row.appendChild(cmt);
    }

    container.appendChild(row);

    if (item.t === 'd' && item.ch) {
      const sub = document.createElement('div');
      const startOpen = depth === 0;
      if (!startOpen) { sub.style.display = 'none'; ic.className = 'ti ti-folder'; }
      container.appendChild(sub);
      build(item.ch, sub, pfx + cPfx, depth + 1);

      let open = startOpen;
      row.style.cursor = 'pointer';
      row.onmouseenter = () => row.style.background = 'var(--surface-1)';
      row.onmouseleave = () => row.style.background = '';
      row.onclick = () => {
        open = !open;
        sub.style.display = open ? '' : 'none';
        ic.className = open ? 'ti ti-folder-open' : 'ti ti-folder';
      };
    } else if (item.t === 'f') {
      row.style.cursor = 'pointer';
      row.onmouseenter = () => row.style.background = 'var(--surface-1)';
      row.onmouseleave = () => row.style.background = '';
      row.onclick = () => sendPrompt('Explain what goes inside ' + item.n + ' in Mercury AI — what classes, functions, and logic it should contain');
    }
  });
}

build(D, wrap, '', 0);
</script>
